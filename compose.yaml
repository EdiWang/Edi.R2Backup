services:
  r2backup:
    image: edi-r2backup:1.0.0
    build: .
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * 4}
      TZ: ${TZ:-Etc/UTC}
      R2_REMOTE: ${R2_REMOTE:-r2}
      R2_BUCKETS: ${R2_BUCKETS:?Specify the space-separated bucket names}
    volumes:
      - type: bind
        source: ${LOCAL_BACKUP_PATH:?Specify an absolute local backup path}
        target: /backup
        bind:
          create_host_path: false
      - type: bind
        source: ${RCLONE_CONFIG_PATH:?Specify the rclone credentials file}
        target: /run/secrets/rclone.conf
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
